<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Euphoria 2024</title>
    <link rel="stylesheet" href="stlee.css">
</head>
<body>
    <div class="contact-container">
        <h1>Contact Us - Euphoria 2024</h1>
        <p>If you have any questions or need more information about Euphoria 2024, please feel free to reach out to us using the form below.</p>
        
        <form id="contactForm" name="submit-to-google-sheet">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Submit</button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <script>
            const scriptURL = 'https://script.google.com/macros/s/AKfycbz9kLuYfZ2akKWlSmipwFqCVEgRpvGLAwYaB7l9cjpqVDEUn566h3y73GVumSkfNHw/exec'
            const form = document.forms['submit-to-google-sheet']
  
    form.addEventListener('submit', e => {
      e.preventDefault()
      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => alert('Success!', response))
        .catch(error => alert('Error!', error.message))
    })
    </script>
</body>
</html>
